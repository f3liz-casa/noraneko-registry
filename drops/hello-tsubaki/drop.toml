# actor も Tsubaki で書かれた drop。actor.ts は無い —
# 有るのは ops/main.tsubaki と、この [actor] だけ。build が標準の殻を着せる。

uuid = "1da7ff69-3500-4bdc-b838-029dfce35a34"
name = "hello-tsubaki"
note = "actor まで Tsubaki で書いた、いちばん小さい drop(ツールバーの数字。押すと増えて、pref に残る)"
contact = ["gh/nyanrus"]
actors = ["hello"]

[actor]
id = "hello-tsubaki@noraneko.app"
namespace = "noraHelloTsubaki"
version = "1.1.0"
matches = ["chrome://browser/content/browser.xhtml"]
run_at = "document_end"

# 自分の名前空間は noraneko.hello-tsubaki.* で、そこは書かなくても読み書きできる。
# この drop の数え札は noraneko.hello.count -- 名前空間の外なので、名指しで書く。
# (入れる人の画面には、この一行がそのまま日本語で出る)
[permissions]
prefs = ["noraneko.hello.count"]
# setup() が生の CSS を一枚出している(帯の見た目)。生の一枚はどこにでも届くので、
# 自分の置いたものだけを飾っていても、宣言が要る。
chrome_style = true

[deps]
std = "0064c162-13ac-458e-80ef-e73b1bc49a24"

[compat]
std = "1"
