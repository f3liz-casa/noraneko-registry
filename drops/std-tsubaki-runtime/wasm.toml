# この drop が配っている wasm が、何から出たか。
#
# 手で置いた blob は「どこから来たか」をコメントでしか言っていなかった。
# ここに書いておくと、verify が sha256 を見るので、黙って差し替わらない。
#
# **まだ CI では組んでいない。** 二つ足りない:
#   1. tsubaki の枝(shiro/split-ast-runtime)が push されていない -- 取りに行けない
#   2. bit 単位では再現しない。手元で recipe のとおりに組み直すと 309,620 バイトで、
#      配っているものより一バイト大きい(2026-09-13、rustc 1.94.1 / wasm-opt 130)。
#      recipe は合っているが、同じ bytes を出すには toolchain の版も固定することになる
#
# 組みかた: scripts/build-wasm.rb(手元の tsubaki を指して、組んで、突き合わせる)

[wasm]
file = "src/wasm/tsbvm.wasm"
sha256 = "b5f35d4e82ded92162e38aab91c9d1fbc1b238ebc1ef6adc9241c38f5091e752"
bytes = 309619

[source]
repo = "https://github.com/nyanrus/tsubaki"
commit = "914d2c2"
branch = "shiro/split-ast-runtime"   # push 未
path = "tsbvm/"

[recipe]
target = "wasm32-unknown-unknown"
cargo = "cargo build --release --target wasm32-unknown-unknown"
wasm_opt = "wasm-opt -Oz --enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int"

[built_with]
rustc = "1.94.1"
wasm_opt = "130"
