# actor も Tsubaki で書かれた drop。actor.ts も io/ も無く、有るのは
# src/show-current-tab/ops/show-current-tab.tsubaki と、この [actor] だけ。
#
# する仕事は一つ。タブをたくさん開いていて、タブ帯をスクロールした先で
# 「いま見ているタブ」を見失ったときに、**視界のほうを**動かして、そのタブを
# 先頭に連れてくる。タブは一枚も動かない。
#
# 縦タブのことも、RTL のことも、はみ出していないときに何もしないことも、
# この drop は知らない -- 全部、殻の命令の表の側に入っている
# (abi/v1.json の commands と、_shared/commands.ts の scroll-to-selected-tab)。
# 一度書いて一度審査されたもので、以後どの drop も宣言に一行足すだけで使える。

uuid = "543365a4-a09d-48fd-9411-4696220ab53b"
name = "show-current-tab"
note = "タブを見失ったら、タブの右クリック → いま見ているタブへ。並びは変えずに、視界だけが動く"
contact = ["gh/nyanrus"]
actors = ["show-current-tab"]

[actor]
id = "show-current-tab@noraneko.app"
namespace = "noraShowCurrentTab"
version = "1.0.1"
matches = ["chrome://browser/content/browser.xhtml"]
run_at = "document_end"

# 入れる人の画面には、この二行がそのまま日本語で出る。
# タブのことは読まない -- どのタブが選ばれているかを知るのは、命令の側。
[permissions]
commands = ["scroll-to-selected-tab"]
menu = ["tabContextMenu"]

[deps]
std = "0064c162-13ac-458e-80ef-e73b1bc49a24"

[compat]
std = "1"
