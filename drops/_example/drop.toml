# drops/<name>/ の書きかた(この dir は例。実際の drop は drops/<name>/ に)
#
#   drops/<name>/drop.toml
#   drops/<name>/src/<actor>/actor.ts      実際に xpi になる source。PR にそのまま出る(レビューはこれを読む)
#
# build は registry の中で完結する(tooling/ の道具で、外の repo は使わない)。
# レビューで通って main に入ると、CI が build して registry の判(manifest.json.sigstore.json)を押して配る。
# 作者の署名は要らない。代わりに連絡先(contact)を書く。困ったとき、誰に訊けばいいかが分かるように。
#
# 正体は uuid、名前は札(Julia の General と同じ絵)。配る URL も、noraneko に入れる字も uuid。
# 別の registry に同じ名前があっても、uuid が違えば別のもの。一度振ったら変えない。

uuid = "00000000-0000-4000-8000-000000000000"   # uuidgen で一つ振る(小文字)
name = "example"                                  # この dir の名前と同じ。registry の中で一つ
note = "何をする drop か、一行で"
contact = ["gh/nyanrus", "mail/nyanrus@example.org", "social/@nyanrus@sukhi.f3liz.casa"]
actors = ["example"]   # src/<actor>/actor.ts(いくつでも)
