# umbrella: std に依存すると preact-xul と tsubaki-runtime が付いてくる。
# 版は使う側が build したときの registry の版で固定される(組み直さない限り古いまま)。

uuid = "0064c162-13ac-458e-80ef-e73b1bc49a24"
name = "std"
note = "drop の標準の土台: std-actor + std-preact-xul + std-prefs + std-tsubaki-runtime + std-context-menu + std-settings"
contact = ["gh/nyanrus"]
lib = true
version = "1.17.0"

[deps]
std-actor = "41617246-60d5-4808-bbfd-7dec87e21d26"
std-preact-xul = "39551741-bb5b-4664-b963-611ea6e3dfed"
std-prefs = "19cc889a-92e4-460c-948d-38f7059a9657"
std-tsubaki-runtime = "8a0e317f-4d94-4917-aef4-ad26aac11653"
std-context-menu = "ca35ab2d-3dc3-46cd-ae27-af7ff0560d3d"
std-settings = "60f9cb39-c9a8-420e-8f05-07aaecc17bb2"

# umbrella が言えることは「この組み合わせなら動く」の一言しかないので、それを書く。
# 書かないと、使う drop を組み直すたびに、その時いちばん新しい版が黙って入る。
# runtime の 0.x は minor が上がると壊れうる(Julia と同じ読みかた)ので、
# 上げるときは std の版も上げる = 何と何が合うのかが台帳に残る。
[compat]
std-actor = "1"                   # [1.0.0, 2.0.0) — 殻。前は drop ごとに一枚ずつ入っていた
std-preact-xul = "1.2"            # [1.2.0, 2.0.0) — moveBefore の並び替えと、paint を待たない signal の購読から
std-prefs = "1"                   # [1.0.0, 2.0.0)
std-tsubaki-runtime = "0.15"      # [0.15.0, 0.16.0) — 仕舞うことば(HideTab / ShowTab /
                                  #   SelectTab)と、窓の覚書、戻ってくるタブの迎えかた(Restore)から
std-context-menu = "1"            # [1.0.0, 2.0.0)
std-settings = "1"                # [1.0.0, 2.0.0)
