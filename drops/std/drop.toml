# umbrella: std に依存すると preact-xul と tsubaki-runtime が付いてくる。
# 版は使う側が build したときの registry の版で固定される(組み直さない限り古いまま)。

uuid = "0064c162-13ac-458e-80ef-e73b1bc49a24"
name = "std"
note = "drop の標準の土台: std-preact-xul + std-prefs + std-tsubaki-runtime"
contact = ["gh/nyanrus"]
lib = true
version = "1.2.0"

[deps]
std-preact-xul = "39551741-bb5b-4664-b963-611ea6e3dfed"
std-prefs = "19cc889a-92e4-460c-948d-38f7059a9657"
std-tsubaki-runtime = "8a0e317f-4d94-4917-aef4-ad26aac11653"

# umbrella が言えることは「この組み合わせなら動く」の一言しかないので、それを書く。
# 書かないと、使う drop を組み直すたびに、その時いちばん新しい版が黙って入る。
# runtime の 0.x は minor が上がると壊れうる(Julia と同じ読みかた)ので、
# 上げるときは std の版も上げる = 何と何が合うのかが台帳に残る。
[compat]
std-preact-xul = "1"              # [1.0.0, 2.0.0)
std-prefs = "1"                   # [1.0.0, 2.0.0)
std-tsubaki-runtime = "0.5.1"     # [0.5.1, 0.6.0) — actor を Tsubaki で書くときの言葉(VNode, frame, effect)を持つ版から
