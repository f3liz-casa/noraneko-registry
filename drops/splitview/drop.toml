# 本体(Firefox 155)は分割ビューを持っている ── ただし二枚、横に並べるだけ。
# この drop は、そこを開ける: 三枚・四枚、並べかたを絵から選ぶ、タブを落として足す、
# ペインを閉じる / ひとりにする。
#
# 芯は一つ。#tabbrowser-tabpanels の中を flex から **grid** に替えること。
# 本体の CSS は column="0" と "1" の order しか知らないので、三枚目からは行き場が
# 無い。grid なら「どこに置くか」を一枚ずつ言えるので、order も DOM の順も要らなく
# なって、境のドラッグも自分で持てる(= 動かしている最中に中身がついてくる)。
#
# 触るものは src/splitview/io/ に全部ある。窓に置いたものは ctx.io を通っているので、
# 外せば元の二枚の分割ビューがそのまま戻る。

uuid = "53075336-7e4d-47d8-9359-5b2ad96f8351"
name = "splitview"
note = "分割ビューを二枚から四枚へ(並べかたを絵から選ぶ、タブを落として足す、境をドラッグ、ペインを閉じる/ひとりにする)"
contact = ["gh/nyanrus"]
actors = ["splitview"]   # src/splitview/actor.ts。ブラウザの窓そのもの(browser.xhtml)に効く

# [deps] は無い。view を preact で描いていないので(置くのは境が三本と、メニューの
# 行が二つと、隅のボタン ── どれも要素ひとつに listener ひとつで、木ではない)、
# std を連れてくると preact と Tsubaki の runtime がそのぶん降ってくるだけになる。
