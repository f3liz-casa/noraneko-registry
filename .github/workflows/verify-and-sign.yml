# drops/<name>/ が変わったら: registry の中で build する(tooling/ の道具 + drops/<name>/src。外の repo は使わない)(PR)。
# main に入ったら(管理者が environment "registry" で承認したら): registry の判(keyless、この workflow の identity)を押して、
# dl.f3liz.casa/drop/<uuid> に POST する(正体は drop.toml の uuid。name は dir と札)。
# 置く側(Cloudflare Worker)が、その判が registry の identity で押されているか・xpi の sha256 が manifest と揃っているかを
# 確かめてから B2 に書く。token は無い(判そのものが門)。この repo は B2 の鍵を持たない。
#
# 判は registry のもの一つ。ブラウザは「選んだ registry の identity で押されているか」を見せる。入れるかは本人が決める。
# registry は足せる(ブラウザの設定)。この repo はその既定の一つ。
name: verify-and-sign
on:
  pull_request:
    paths: ["drops/**", "tooling/**", "trusted_root.json", "scripts/**", ".github/workflows/**"] # main の必須 check が verify なので、workflow 自身の変更でも走らせる
  push:
    branches: [main]
    paths: ["drops/**"]
  workflow_dispatch: # 手で: main のいまの drop を、もう一度 build して判を押して置き直す(Worker 側を確かめるときや、置き場が飛んだとき)
    inputs:
      name:
        description: "drop の名前(drops/<name>)"
        required: true

# 誰が何を動かせるか:
# - PR の verify: 読むだけ(contents: read)。id-token は無いので、PR の中では registry の判は押せない。
#   fork からの PR は、外の人なら毎回 管理者の approve が要る(repo の Actions 設定: all external contributors)。
# - sign: main への push だけ。environment "registry"(required reviewer = 管理者)なので、
#   workflow が変わっていても、管理者が「実行」を押すまで判は押されない。
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04-arm # noraneko の drop は arm64 でも x86_64 でも同じ bytes になるはず。揃えて arm64
    outputs:
      names: ${{ steps.changed.outputs.names }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          # PR は merge commit でなく head を build する(manifest の source.commit を PR の commit にする。
          # merge commit は GitHub が作る仮のもので、手元に無い)
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@v2
      - run: npm ci --silent || npm install --silent
      - run: mise exec -- deno --version

      - name: 変わった drop を数える
        id: changed
        run: |
          if [ -n "${{ github.event.inputs.name }}" ]; then
            names="${{ github.event.inputs.name }} "
          else
            base=${{ github.event.pull_request.base.sha || github.event.before }}
            git fetch -q --depth=1 origin "$base" 2>/dev/null || true
            names=$(git diff --name-only "$base" HEAD -- drops | awk -F/ '{print $2}' | sort -u | grep -v '^_' | tr '\n' ' ')
            # 道具(tooling / scripts)が変わったら、drop は全部 build して確かめる(PR のときだけ。判は押さない)
            if [ -z "$names" ] && [ "${{ github.event_name }}" = pull_request ] && git diff --name-only "$base" HEAD -- tooling scripts | grep -q .; then
              names=$(ls -d drops/*/ | awk -F/ '{print $2}' | grep -v '^_' | tr '\n' ' ')
            fi
          fi
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "changed: $names"

      - name: uuid が揃っているか(形が正しく、registry の中で一つずつ)
        run: |
          set -e
          for t in drops/*/drop.toml; do
            case "$t" in drops/_*) continue;; esac
            u=$(sed -n 's/^uuid *= *"\([^"]*\)".*/\1/p' "$t")
            echo "$u" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' || { echo "$t: uuid の形が違う(小文字の uuid): '$u'"; exit 1; }
            echo "$u  $t"
          done | tee /tmp/uuids
          dup=$(awk '{print $1}' /tmp/uuids | sort | uniq -d)
          [ -z "$dup" ] || { echo "同じ uuid が二つ以上ある: $dup"; exit 1; }

      - name: compat(版の範囲の読みかた)の試験
        run: mise exec -- ruby scripts/compat.rb --test

      - name: registry の中で build する(tooling/ + drops/<name>/src)
        if: steps.changed.outputs.names != ''
        run: |
          set -e
          for name in ${{ steps.changed.outputs.names }}; do
            echo "== $name"
            mise exec -- ruby scripts/build.rb drops/$name
            echo "-- manifest(Linux arm64)。手元(mac)の sha256 と比べる"
            cat _build/$name/manifest.json
          done

  sign:
    # main に入ったものだけ。environment "registry" は required reviewer つきで、管理者が承認するまでここは走らない
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.verify.outputs.names != ''
    runs-on: ubuntu-24.04-arm
    environment: registry
    permissions:
      contents: write # 台帳(versions.toml)を ledger/versions 枝に積む。main には書けない(PR 必須)
      pull-requests: write # その枝の PR を一本、開いておく
      id-token: write # keyless 署名(Fulcio に OIDC を見せる)。この job だけ
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: jdx/mise-action@v2
      - run: npm ci --silent || npm install --silent
      - name: もう一度 build する(verify と同じ bytes になるはず。artifact は渡さず、ここで作り直す)
        run: |
          set -e
          for name in ${{ needs.verify.outputs.names }}; do
            mise exec -- ruby scripts/build.rb drops/$name
            cat _build/$name/manifest.json
          done
      - name: registry の判を押して dl.f3liz.casa に置く
        env:
          DL: https://dl.f3liz.casa
        run: |
          set -e
          curl -sSfLo /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-arm64" && chmod +x /usr/local/bin/cosign
          for name in ${{ needs.verify.outputs.names }}; do
            d=drops/$name
            uuid=$(sed -n 's/^uuid *= *"\([^"]*\)".*/\1/p' $d/drop.toml)
            # manifest は build の産物を正とし、drop.toml の contact(連絡先)を写す。それに registry の判
            node -e '
              const fs = require("fs"); const [d, toml] = process.argv.slice(1);
              const m = JSON.parse(fs.readFileSync(`_build/${d.split("/").pop()}/manifest.json`, "utf8"));
              // contact = "gh/x" でも contact = ["gh/x", "mail/y", "social/@z@host"] でも
              const line = (fs.readFileSync(toml, "utf8").match(/^contact\s*=\s*(.+)$/m) || [])[1] || "";
              const contact = [...line.matchAll(/"([^"]+)"/g)].map((x) => x[1]);
              if (contact.length) m.contact = contact;
              fs.writeFileSync(`${d}/manifest.json`, JSON.stringify(m, null, 2) + "\n");
            ' $d $d/drop.toml
            cosign sign-blob --yes --bundle $d/manifest.json.sigstore.json $d/manifest.json
            # 判の一覧(人が辿れるリンク)を manifest の隣に
            node -e '
              const fs = require("fs"); const d = process.argv[1];
              const idx = (f) => { try { return JSON.parse(fs.readFileSync(f, "utf8")).verificationMaterial.tlogEntries[0].logIndex; } catch { return null; } };
              const att = [{ who: "registry", bundle: "manifest.json.sigstore.json" }]
                .map((a) => ({ ...a, rekor: idx(`${d}/${a.bundle}`) }))
                .map((a) => ({ ...a, rekorUrl: a.rekor ? `https://search.sigstore.dev/?logIndex=${a.rekor}` : null }));
              att.push({ who: "registry-run", url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}` });
              const m = JSON.parse(fs.readFileSync(`${d}/manifest.json`, "utf8"));
              fs.writeFileSync(`${d}/attestations.json`, JSON.stringify({ uuid: m.uuid, name: m.name, attestations: att }, null, 2) + "\n");
            ' $d
            # 置く: multipart で一度に、uuid の下へ。Worker が判と sha256 と uuid を確かめてから B2 に書く(noraneko-ci/artifacts-dl)
            args=(-F "manifest.json=@$d/manifest.json" -F "manifest.json.sigstore.json=@$d/manifest.json.sigstore.json" -F "attestations.json=@$d/attestations.json")
            for x in _build/$name/*.xpi; do args+=(-F "$(basename "$x")=@$x"); done
            curl -sSf -X POST "$DL/drop/$uuid" "${args[@]}"
            echo
            echo "-- $DL/drop/$uuid/manifest.json ($name)"
            curl -sSfI "$DL/drop/$uuid/manifest.json" | grep -i '^x-drop'
          done

      # 台帳: どの版に判を押したか(Julia の General の Versions.toml の絵。registry 自身が「どの版があるか」を持つ)。
      # main は PR 必須なので、ledger/versions 枝に積んで PR を一本開いておく。merge は管理者(Registrator と AutoMerge の間)。
      # yank は人が versions.toml に yanked = true を書く PR。yank しても dl は配り続ける(固定済みの drop のため)。
      - name: 台帳(versions.toml)を ledger/versions に積む
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "noraneko-registry (sign)"
          git config user.email "noreply@f3liz.casa"
          git fetch -q origin main
          if git fetch -q origin ledger/versions 2>/dev/null; then
            git checkout -q -B ledger/versions origin/ledger/versions
            git merge -q --no-edit origin/main || { echo "ledger/versions と main がぶつかる。手で直して"; exit 1; }
          else
            git checkout -q -B ledger/versions origin/main
          fi
          for name in ${{ needs.verify.outputs.names }}; do
            d=drops/$name
            node -e '
              const fs = require("fs"); const d = process.argv[1];
              const m = JSON.parse(fs.readFileSync(`${d}/manifest.json`, "utf8"));
              const path = `${d}/versions.toml`;
              let text = fs.existsSync(path) ? fs.readFileSync(path, "utf8") : "# 判が押された版の台帳(sign job が積む)。yank は yanked = true を書く PR\n";
              for (const e of m.entries) {
                const semver = e.version.match(/^\d+\.\d+\.\d+/)[0];
                const re = new RegExp(`^\\["${semver.replace(/\./g, "\\.")}"\\]`, "m");
                if (re.test(text)) { console.log(`${d}: ${semver} はもう台帳にある(置き直し)`); continue; }
                text += `\n["${semver}"]\ncommit = "${m.source.commit}"\ntime = "${m.source.commit_time}"\nfile = "${e.file}"\nsha256 = "${e.sha256}"\n`;
              }
              fs.writeFileSync(path, text);
            ' $d
            git add $d/versions.toml
          done
          if git diff --cached --quiet; then echo "台帳に足すものは無い"; exit 0; fi
          git commit -q -m "versions: ${{ needs.verify.outputs.names }}(${GITHUB_SHA::10})"
          git push -q origin ledger/versions
          if [ -z "$(gh pr list --head ledger/versions --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head ledger/versions --title "versions: 判を押した版の台帳" \
              --body "sign job が積む台帳(drops/<name>/versions.toml)。merge すると registry がその版を知る(compat の解決に使う)。yank は yanked = true をここに。"
          fi
