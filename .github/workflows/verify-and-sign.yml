# drops/<code>/ が変わったら: drop.toml の source を同じ道具で rebuild する(PR)。作者の判があれば確かめる。
# main に入ったら: registry の判(keyless、この workflow の identity)を押して、B2 の drops/<code>/ に置く
# (dl.f3liz.casa/drop/<code>/ で配られる)。
#
# 判は registry のもの一つ。ブラウザは「選んだ registry の identity で押されているか」を見せる。入れるかは本人が決める。
# registry は足せる(ブラウザの設定)。この repo はその既定の一つ。
name: verify-and-sign
on:
  pull_request:
    paths: ["drops/**", "trusted_root.json", "scripts/**"]
  push:
    branches: [main]
    paths: ["drops/**"]

permissions:
  contents: read
  id-token: write # keyless 署名(Fulcio に OIDC を見せる)

jobs:
  verify:
    runs-on: ubuntu-24.04-arm # noraneko の drop は arm64 でも x86_64 でも同じ bytes になるはず。揃えて arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: jdx/mise-action@v2
      - run: npm ci --silent || npm install --silent

      - name: 変わった drop を数える
        id: changed
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          codes=$(git diff --name-only "$base" HEAD -- drops | awk -F/ '{print $2}' | sort -u | grep -v '^_' | tr '\n' ' ')
          echo "codes=$codes" >> "$GITHUB_OUTPUT"
          echo "changed: $codes"

      - name: 作者の判があれば確かめる(無くてよい。判は registry が押す)
        if: steps.changed.outputs.codes != ''
        run: |
          set -e
          for code in ${{ steps.changed.outputs.codes }}; do
            d=drops/$code
            if [ -f $d/manifest.json.author.sigstore.json ]; then
              identity=$(grep -E '^identity' $d/drop.toml | tail -1 | sed 's/.*= *"//; s/".*//')
              issuer=$(grep -E '^issuer' $d/drop.toml | tail -1 | sed 's/.*= *"//; s/".*//')
              echo "== $code: author $identity"
              node scripts/verify.mjs $d/manifest.json.author.sigstore.json $d/manifest.json "$identity" "$issuer"
            else
              echo "== $code: 作者の判なし(registry の判だけ)"
            fi
          done

      - name: 同じ commit を rebuild して sha256 を比べる
        if: steps.changed.outputs.codes != ''
        run: |
          set -e
          for code in ${{ steps.changed.outputs.codes }}; do
            echo "== $code"
            mise exec -- ruby scripts/rebuild.rb drops/$code
          done

      - name: registry の判を押して B2 に置く(main だけ)
        if: github.event_name == 'push' && steps.changed.outputs.codes != ''
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ vars.B2_BUCKET }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
          B2_REGION: ${{ vars.B2_REGION }}
        run: |
          set -e
          curl -sSfLo /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-arm64" && chmod +x /usr/local/bin/cosign
          S3="--aws-sigv4 aws:amz:$B2_REGION:s3 --user $B2_KEY_ID:$B2_APP_KEY"
          for code in ${{ steps.changed.outputs.codes }}; do
            d=drops/$code
            # manifest は rebuild の産物(bytes と一致済)を正とする。registry の判: manifest.json への keyless 署名
            cp _rebuild/$code/manifest.json $d/manifest.json
            cosign sign-blob --yes --bundle $d/manifest.json.sigstore.json $d/manifest.json
            # 判の一覧(人が辿れるリンク)を manifest の隣に
            node -e '
              const fs = require("fs"); const d = process.argv[1];
              const idx = (f) => { try { return JSON.parse(fs.readFileSync(f, "utf8")).verificationMaterial.tlogEntries[0].logIndex; } catch { return null; } };
              const att = [{ who: "registry", bundle: "manifest.json.sigstore.json" }, { who: "author", bundle: "manifest.json.author.sigstore.json" }]
                .filter((a) => fs.existsSync(`${d}/${a.bundle}`))
                .map((a) => ({ ...a, rekor: idx(`${d}/${a.bundle}`) }))
                .map((a) => ({ ...a, rekorUrl: a.rekor ? `https://search.sigstore.dev/?logIndex=${a.rekor}` : null }));
              att.push({ who: "registry-run", url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}` });
              fs.writeFileSync(`${d}/attestations.json`, JSON.stringify({ code: d.split("/").pop(), attestations: att }, null, 2) + "\n");
            ' $d
            # 置く: xpi は rebuild の産物(bytes は manifest と一致済)、manifest / 判 / attestations は registry のもの
            for f in _rebuild/$code/*.xpi $d/manifest.json $d/manifest.json.sigstore.json $d/manifest.json.author.sigstore.json $d/attestations.json; do
              [ -f "$f" ] || continue
              curl -sf $S3 -T "$f" "$B2_ENDPOINT/$B2_BUCKET/drops/$code/$(basename "$f")" && echo "up drops/$code/$(basename "$f")"
            done
          done
