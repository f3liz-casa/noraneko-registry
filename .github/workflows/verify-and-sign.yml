# drops/<code>/ が変わったら: registry の中で build する(tooling/ の道具 + drops/<code>/src。外の repo は使わない)(PR)。
# main に入ったら: registry の判(keyless、この workflow の identity)を押して、dl.f3liz.casa/drop/<code> に POST する。
# 置く側(Cloudflare Worker)が、その判が registry の identity で押されているか・xpi の sha256 が manifest と揃っているかを
# 確かめてから B2 に書く。token は無い(判そのものが門)。この repo は B2 の鍵を持たない。
#
# 判は registry のもの一つ。ブラウザは「選んだ registry の identity で押されているか」を見せる。入れるかは本人が決める。
# registry は足せる(ブラウザの設定)。この repo はその既定の一つ。
name: verify-and-sign
on:
  pull_request:
    paths: ["drops/**", "tooling/**", "trusted_root.json", "scripts/**", ".github/workflows/**"] # main の必須 check が verify なので、workflow 自身の変更でも走らせる
  push:
    branches: [main]
    paths: ["drops/**"]

permissions:
  contents: read
  id-token: write # keyless 署名(Fulcio に OIDC を見せる)

jobs:
  verify:
    runs-on: ubuntu-24.04-arm # noraneko の drop は arm64 でも x86_64 でも同じ bytes になるはず。揃えて arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          # PR は merge commit でなく head を build する(manifest の source.commit を PR の commit にする。
          # merge commit は GitHub が作る仮のもので、手元に無い)
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@v2
      - run: npm ci --silent || npm install --silent
      - run: mise exec -- deno --version

      - name: 変わった drop を数える
        id: changed
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          git fetch -q --depth=1 origin "$base" 2>/dev/null || true
          codes=$(git diff --name-only "$base" HEAD -- drops | awk -F/ '{print $2}' | sort -u | grep -v '^_' | tr '\n' ' ')
          echo "codes=$codes" >> "$GITHUB_OUTPUT"
          echo "changed: $codes"

      - name: registry の中で build する(tooling/ + drops/<code>/src)
        if: steps.changed.outputs.codes != ''
        run: |
          set -e
          for code in ${{ steps.changed.outputs.codes }}; do
            echo "== $code"
            mise exec -- ruby scripts/build.rb drops/$code
            echo "-- manifest(Linux arm64)。手元(mac)の sha256 と比べる"
            cat _build/$code/manifest.json
          done

      - name: registry の判を押して dl.f3liz.casa に置く(main だけ)
        if: github.event_name == 'push' && steps.changed.outputs.codes != ''
        env:
          DL: https://dl.f3liz.casa
        run: |
          set -e
          curl -sSfLo /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-arm64" && chmod +x /usr/local/bin/cosign
          for code in ${{ steps.changed.outputs.codes }}; do
            d=drops/$code
            # manifest は build の産物を正とし、drop.toml の contact(連絡先)を写す。それに registry の判
            node -e '
              const fs = require("fs"); const [d, toml] = process.argv.slice(1);
              const m = JSON.parse(fs.readFileSync(`_build/${d.split("/").pop()}/manifest.json`, "utf8"));
              // contact = "gh/x" でも contact = ["gh/x", "mail/y", "social/@z@host"] でも
              const line = (fs.readFileSync(toml, "utf8").match(/^contact\s*=\s*(.+)$/m) || [])[1] || "";
              const contact = [...line.matchAll(/"([^"]+)"/g)].map((x) => x[1]);
              if (contact.length) m.contact = contact;
              fs.writeFileSync(`${d}/manifest.json`, JSON.stringify(m, null, 2) + "\n");
            ' $d $d/drop.toml
            cosign sign-blob --yes --bundle $d/manifest.json.sigstore.json $d/manifest.json
            # 判の一覧(人が辿れるリンク)を manifest の隣に
            node -e '
              const fs = require("fs"); const d = process.argv[1];
              const idx = (f) => { try { return JSON.parse(fs.readFileSync(f, "utf8")).verificationMaterial.tlogEntries[0].logIndex; } catch { return null; } };
              const att = [{ who: "registry", bundle: "manifest.json.sigstore.json" }]
                .map((a) => ({ ...a, rekor: idx(`${d}/${a.bundle}`) }))
                .map((a) => ({ ...a, rekorUrl: a.rekor ? `https://search.sigstore.dev/?logIndex=${a.rekor}` : null }));
              att.push({ who: "registry-run", url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}` });
              fs.writeFileSync(`${d}/attestations.json`, JSON.stringify({ code: d.split("/").pop(), attestations: att }, null, 2) + "\n");
            ' $d
            # 置く: multipart で一度に。Worker が判と sha256 を確かめてから B2 に書く(noraneko-ci/artifacts-dl)
            args=(-F "manifest.json=@$d/manifest.json" -F "manifest.json.sigstore.json=@$d/manifest.json.sigstore.json" -F "attestations.json=@$d/attestations.json")
            for x in _build/$code/*.xpi; do args+=(-F "$(basename "$x")=@$x"); done
            curl -sSf -X POST "$DL/drop/$code" "${args[@]}"
            echo
            echo "-- $DL/drop/$code/manifest.json"
            curl -sSfI "$DL/drop/$code/manifest.json" | grep -i '^x-drop'
          done
